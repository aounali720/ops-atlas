apiVersion: v1
kind: Namespace
metadata:
  name: stackbound-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sb-config
  namespace: stackbound-lab
data:
  TRAINING_ENV: "local"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sb-web
  namespace: stackbound-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sb-web
  template:
    metadata:
      labels:
        app: sb-web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: sb-config
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sb-web
  namespace: stackbound-lab
spec:
  selector:
    app: sb-web
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
