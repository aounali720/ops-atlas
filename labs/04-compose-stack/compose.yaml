services:
  app:
    build: ./app
    restart: unless-stopped
    volumes:
      - visits:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '127.0.0.1:8081:80'
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  visits:
